<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayOne</title>

  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root {
      --bg-color: #0b0b0d;
      --card-bg: #16161a;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #f39c12, #d4af37);
      --text-color: #f0f0f0;
      --text-muted: #8a8a93;
      --border-color: #26262e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.8rem;
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      font-weight: 800;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Streak Section */
    .streak-display {
      text-align: center;
      padding: 10px 0;
    }

    .streak-count {
      font-size: 3rem;
      font-weight: 800;
      color: var(--text-color);
    }

    .streak-fire {
      color: #e67e22;
      font-size: 2.5rem;
    }

    /* To-Do Section */
    .todo-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
    }

    input[type="text"]:focus {
      outline: 1px solid var(--accent-gold);
    }

    button {
      background: var(--accent-gold-gradient);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      background: #0f0f12;
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .todo-item.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-item input[type="checkbox"] {
      accent-color: var(--accent-gold);
      transform: scale(1.2);
    }

    /* Chat Section */
    .chat-box {
      height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
      margin-bottom: 10px;
    }

    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent-gold-gradient);
      color: #000;
      font-weight: 600;
    }

    .message.bot {
      align-self: flex-start;
      background: #22222a;
      border: 1px solid var(--border-color);
    }

      background: #111;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 6px 10px;
      border-radius: 6px
